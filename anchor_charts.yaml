# Anchor charts: felt difficulty from actual play, used to evaluate the model
#
# Unlike ground_truth_ratings.yaml, these are NOT training labels. They are a
# regression harness: `uv run check-anchors` prints each chart's calculated
# rating next to how it felt, so feature/model changes can be judged against
# lived experience rather than aggregate MAE alone.
#
# Fields:
#   song         – "Pack/Folder", as in a StepMania course (#SONG:Pack/Folder)
#   chart_type   – dance-single | dance-double
#   difficulty   – Beginner | Easy | Medium | Hard | Challenge
#   min, max     – felt rating range on the modern_ddr scale (either optional)
#   harder_than  – optional list of "Pack/Folder:Difficulty" (same chart_type)
#                  that this chart must out-rate
#   note         – optional free text

