# Ground truth rating overrides
#
# These correct known-wrong normalized_rating values used as training labels.
# Each entry replaces the computed label for a specific chart with a
# human-verified difficulty rating on the modern_ddr scale (1–20).
#
# Fields:
#   song        – "Pack/Folder" as in a StepMania course (#SONG:Pack/Folder);
#                 matches the chart's directory exactly, so use it instead of
#                 title/pack when the in-file title is Japanese or ambiguous
#   title       – song title, case-insensitive exact match
#   pack        – optional pack name substring to disambiguate (case-insensitive)
#   chart_type  – dance-single | dance-double | dance-couple | dance-solo | all
#   difficulty  – Beginner | Easy | Medium | Hard | Challenge | all
#   rating      – true difficulty on the modern_ddr scale
#   note        – optional free-text explanation (not used by code)
#
# pack_weights scales the training weight of every chart in a pack whose
# labels are trusted as near-canonical (exact pack directory name match).
#
# The rating is applied to every matched row in the dataset regardless of which
# scale file it came from. When generating an itg or classic_ddr dataset it is
# converted from modern_ddr to that scale first.

pack_weights:

  - pack: "DDR A"
    weight: 3.0
    note: >
      Modern Konami ratings are highly polished; treat them as close to
      canonical.

  - pack: "DDR A20"
    weight: 3.0
    note: >
      Modern Konami ratings are highly polished; treat them as close to
      canonical.

  - pack: "DDR A3"
    weight: 3.0
    note: >
      Modern Konami ratings are highly polished; treat them as close to
      canonical.

overrides:

  # --- Double specific corrections ---

  - title: "La Señorita Virtual"
    chart_type: "dance-double"
    difficulty: "Hard"
    rating: 13.0
    note: >
      Constant back-and-forth lateral shifting makes this significantly harder
      than other 12s; the COM oscillation features capture this but the training
      label anchors the model at 12.

  - title: "La Señorita"
    pack: "DDR 3rd Mix"
    chart_type: "dance-double"
    difficulty: "Hard"
    rating: 13.0
    note: >
      Performance data (90.90% with 3 misses, Tier07) matches PARANOiA Rebirth
      double Hard (91.63%, Tier07), which is rated 13. Original rating of 13 is
      correct; calc was pulling it to 12.5.

  - title: "PARANOiA Rebirth"
    pack: "DDR 3rd Mix"
    chart_type: "dance-double"
    difficulty: "Hard"
    rating: 13.0
    note: >
      Anchor point: 91.63% with 3 misses matches La Señorita double performance.
      Original and calc both say 13; this locks it as a reference label.

  - title: "Crazy"
    pack: "ITG"
    chart_type: "dance-double"
    difficulty: "Hard"
    rating: 10.0
    note: >
      Far easier than TRIP MACHINE survivor despite a similar NPS/normalized
      rating (~11.5). Straightforward single-direction runs, low crossover demand.

  - title: "ROCK BEAT"
    pack: "DDR 3rd Mix"
    chart_type: "dance-double"
    difficulty: "Hard"
    rating: 11.0
    note: >
      97.90% FC on double; calc is already 11.0 so this is a confirming anchor.

  - song: "ITG 3/Sundance"
    chart_type: "dance-double"
    difficulty: "Hard"
    rating: 10.0
    note: Plays like a 10; ITG 7 → 11 overstates it.

  - song: "DDR 2014/Squeeze"
    chart_type: "dance-double"
    difficulty: "Medium"
    rating: 11.25
    note: Plays like 11.0–11.5, above its official 10.

  - song: "DDR A3/Acid,Tribal & Dance (DDR EDITION)"
    chart_type: "dance-double"
